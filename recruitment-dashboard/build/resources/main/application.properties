# -- DATABASE CONNECTION SETTINGS --
#url of the PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/recruitdb
# database username
spring.datasource.username=user1
# database password
spring.datasource.password=user1

# -- JPA AND HIBERNATE CONFIGURATIONS --
# hibernate dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# hibernate schema management strategy
spring.jpa.hibernate.ddl-auto=update
# show sql queries in the log
spring.jpa.show-sql=true
# format sql queries for readability
spring.jpa.properties.hibernate.format_sql=true


# -- LOGGING LEVELS FOR VARIOUS COMPONENTS --
# log level for Apache Camel
logging.level.org.apache.camel=DEBUG
# log level for the applications packages
logging.level.nl.avisi.recruitment.dashboard=DEBUG
# log level for sql statements executed by Hibernate
logging.level.org.hibernate.SQL=DEBUG
# log level for sql value bindings
logging.level.org.hibernate.type.descriptor.sql=TRACE

# -- JACKSON JSON CONFIGURATIONS --
# serialize dates as ISO8601 strings instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
# ignore unknown properties in json payloads during deserialization
spring.jackson.deserialization.fail-on-unknown-properties=false



